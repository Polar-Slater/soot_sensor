<text x="45" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#243447" text-anchor="start">Latest connections: pin 4 → MCP4728 GND; pin 8 → ADS1115 VIN. Sensor clamps remain on the right.</text>
